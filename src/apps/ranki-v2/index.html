<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
    <style>
      body {
        background-color: #151515;
        color: #ccc;
      }
      p {
        white-space: pre-wrap;
      }
      </style>
  </head>
  <body>
    <script id="ranki-config" type="text/yaml">
      version: v2
      metadata:
        deck: "{{Deck}}"
        subdeck: "{{Subdeck}}"
        tags: "{{Tags}}"
        type: "{{Type}}"
        flag: "{{CardFlag}}"
        card: "{{Card}}"
      plugins:
        standards:
          - RankiConstantsV2
          - RankiBaseV2
        requested: 
          - RankiParamsV2
          - RankiFrameV2
        ignore:
          - RankiFrameV1
          - RankiRichTextV2
          - RankiRichNumberV2
          - RankiRichStructureV2
      tokens:
        sentence:
          period: .
          question: "?"
          exclamation: "!"
        paramsV2:
          separator:
            left: ","
            right: ;
          key:
            negation: "!"
          operators:
            assign: "="
            append: +=
            remove: "-="
        richNumberV2:
          complexUnits:
            - i
            - j
            - k
          infinity:
            - inf
            - INF
          pi:
            - pi
            - PI
          e:
            - e
            - E
          hexadecimal:
            - x
            - X
          octal:
            - o
            - O
          binary:
            - b
            - B
          decimal: .
          negative: "-"
          group: _
    </script>
    <script class="ranki-field a" type="text/ranki">{{A}}</script>
    <!-- <script class="ranki-field b" type="text/ranki">{{A}}</script> -->

    <div class="ranki-root"></div>
    <style></style>

    <script type="module" src="/src/main.mts"></script>
  </body>
</html>
