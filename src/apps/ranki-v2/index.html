<!DOCTYPE html>
<html class="night-mode win chrome" data-bs-theme="dark" dir="ltr">
  <head>
    <title>AnkiDroid</title>
    <meta name="viewport" content="initial-scale=1" />
  </head>
  <body style="background-color: black;">
    <div id="qa">
      <link class="r2-config-file user" href="/_ranki2_user_config.yml" rel="preload" as="fetch" crossorigin="anonymous">
      <script class="r2-config card" type="text/yaml"></script>

      <script class="r2-data face" type="text/plain">Q</script>
      <script class="r2-data deck" type="text/plain">Zero::One::Two::Three::Four::Five::Six::Seven::Eight::Nine</script>
      <script class="r2-data tags" type="text/plain">+r::dev::methods +r::dev::persist</script>
      <script class="r2-data type" type="text/plain">+r:AB:BA</script>
      <script class="r2-data flag" type="text/plain">flag0</script>
      <script class="r2-data card" type="text/plain">AB</script>

      <script class="r2-input A" type="text/dqm">
       a
       
        <kbd>SHIFT</kbd> + <kbd>A</kbd>
        
        [code, "yml", font.size="34px"
        hello:
          world: true
        ]

        [frame.v2.debug.dom_info|f]
      
       fd
      </script>
      <script class="r2-input B" type="text/dqm">[frame.v2.debug.dom_info|hi]</script>
      <!-- <script class="r2-input A" type="text/dqm">a</script> -->

      <script type="module" src="/src/main.mts"></script>
    </div>
  </body>
</html>
