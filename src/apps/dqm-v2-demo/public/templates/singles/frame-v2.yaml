group: frame-v2
label: FrameV2
description: Components powered by FrameV2
list:
- id: inline-code
  label: Inline code block
  description: Most basic inline code block
  raw: |
    [code|func]
- id: code-params
  label: Code block with params
  description: Uses params and pauses
  raw: |
    [code, prettier.auto_format=true
    hi,,PAUSED!,,hello
    ]

    2
- id: code-block
  label: Code block
  description: Unnested basic code block
  raw: |
    [code
      () => {}
    ]
- id: code-block-nested
  label: Nested code block
  description: Code block which contains other code blocks
  raw: |
    [code
    hi

      [code
      hello [code|yees]
      ]
    ]
- id: graph-carnage
  label: Graph Carnage
  description: Many nested frames to create a graph carnage
  raw: |
    [code code, hello.cat=5, p
    hi,,PAUSED!,,hello [code code, "5"|bunny 5]
    ]

    2 [code|graph,, df ,,is [code code code|carnage] on]


  
  