<!DOCTYPE html>
<html class="night-mode win chrome" data-bs-theme="dark" dir="ltr">
  <head>
    <title>AnkiDroid</title>
    <meta name="viewport" content="initial-scale=1" />
  </head>
  <body style="background-color: black;">
    <div id="qa">
      <script class="ranki-v2-data face" type="text/plain">Q</script>

      <script class="ranki-v2-input A" type="text/dqm">[code|hi]</script>
      <script class="ranki-v2-input B" type="text/dqm">answer</script>

      <script class="ranki-v2-data deck" type="text/plain">A::B::C</script>
      <script class="ranki-v2-data tags" type="text/plain">hello world +r:scheme-dark</script>
      <script class="ranki-v2-data type" type="text/plain">+r:AB</script>
      <script class="ranki-v2-data flag" type="text/plain">flag1</script>
      <script class="ranki-v2-data card" type="text/plain">AB</script>

      <link class="ranki-v2-config-file user" href="/_ranki2_user_config.yml" rel="preload" as="fetch" crossorigin="anonymous">
      <script class="ranki-v2-config template" type="text/yaml"></script>
      <script class="ranki-v2-config card" type="text/yaml"> </script>

      <script type="module" src="/src/main.mts"></script>
    </div>
  </body>
</html>
