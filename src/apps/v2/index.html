<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Vite + TS</title>
  </head>
  <body>
    <div class="ranki-root"></div>
    
    <data class="front">{{Front}}</data>
    <data class="back">{{Back}}</data>
    
    <style></style>
    <script>
      window.ranki = {
        version: "v2",
        metadata: {
          deck: `{{Deck}}`,
          subdeck: `{{Subdeck}}`,
          tags: `{{Tags}}`,
          type: `{{Type}}`,
          flag: `{{CardFlag}}`,
          card: `{{Card}}`,
        }
      }
    </script>

    <script type="module" src="/src/main.mts"></script>
  </body>
</html>
