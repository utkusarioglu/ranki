flags:
  red:
    cue:
      indicator: red-arch
      message: Questionable information
  orange:
    cue:
      message: Derive more cards
  green: 
    cue:
      message: Needs elaboration
  blue:
    cue:
      message: Possibly outdated
  pink: 
    cue:
      message: Rendering issues
  turquoise:
    cue:
      message: Too extensive
  purple:
    cue:
      message: Poor wording or formatting
tags:
  - exact: marked
    cue: 
      message: Study
      indicator: chatgpt
  - exact: under-construction
    cue:
      indicator: under-construction
  - exact: caution
    cue:
      indicator: caution
  - exact: +r:scheme-light
    cue:
      message: "Light scheme"
    config:
      design:
        scheme: light
  - exact: +r:scheme-dark
    cue: 
      message: "Dark scheme"
    config:
      design:
        scheme: dark
  - exact: +r:theme-print
    cue:
      message: "Print theme"
    config:
      design:
        theme: print
  - exact: +r:animation-slow
    cue:
      message: AnimSlow
    config:
      design:
        animation:
          fade: 4s
