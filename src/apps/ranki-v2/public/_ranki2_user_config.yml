base: 
  palettes:
    - name: generated-saturated
      hues: 
        red: 0
        orange: 30
        yellow: 55
        green: 130
        turquoise: 170
        blue: 210
        purple: 270
        magenta: 320
      lightness: [15, 20, 30, 60, 70, 80, 90, 100]
      saturation: [100, 100, 100, 100, 100, 100, 100, 100]
flags:
  red:
    cue:
      indicator: red-arch
      message: 
        text: Questionable information
  orange:
    cue:
      message: 
        text: Derive more cards
  green: 
    cue:
      message: 
        text: Needs elaboration
  blue:
    cue:
      message: 
        text: Possibly outdated
  pink: 
    cue:
      message: 
        text: Rendering issues
  turquoise:
    cue:
      message: 
        text: Too extensive
  purple:
    cue:
      message: 
        text: Poor wording or formatting
tags:
  - exact: marked
    cue: 
      icon:
        id: book-open
        color: tone-2
      message: 
        text: Study
        color: tone-2
      background: 
        color: blue-1
      indicator: colorful
  - exact: leech
    cue: 
      message: 
        text: Leech
      indicator: checkered
  - exact: clown-college
    cue:
      indicator: clown-college
  - exact: caution
    cue:
      indicator: caution
  - exact: +r::scheme::light
    cue:
      message: 
        text: Light scheme
    config:
      design:
        scheme: light
  - exact: +r::scheme::dark
    cue: 
      message: 
        text: Dark scheme
    config:
      design:
        scheme: dark
  - exact: +r::theme::print
    cue:
      message: 
        text: Print theme
    config:
      design:
        theme: print
  - exact: +r::animation::slow
    cue:
      message: 
        text: AnimSlow
    config:
      design:
        animation:
          fade: 3s
  - exact: +r::animation::disabled
    cue:
      message: 
        text: AnimDisabled
    config:
      design:
        animation:
          fade: "0"
  - exact: +r::palette::saturated
    cue:
      icon: 
        id: disco-ball
        color: blue-2
    config:
      design:
        palette: generated-saturated
